name: Build Windows x64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained EXE launcher template
        run: dotnet publish tools/InstallerLauncher/InstallerLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true --output src/InstallScriptGenerator/Assets
      - name: Restore
        run: dotnet restore src/InstallScriptGenerator/InstallScriptGenerator.csproj
      - name: Build
        run: dotnet build src/InstallScriptGenerator/InstallScriptGenerator.csproj --configuration Release --no-restore
      - name: Smoke tests
        run: dotnet run --project tests/SmokeTests/SmokeTests.csproj --configuration Release
        env:
          ISG_LAUNCHER_TEMPLATE: src/InstallScriptGenerator/Assets/LauncherTemplate.exe
      - name: Publish standalone executable
        run: dotnet publish src/InstallScriptGenerator/InstallScriptGenerator.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/InstallScriptGenerator
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: InstallScriptGenerator-2.0.0-alpha.4-win-x64
          path: artifacts/InstallScriptGenerator/
          if-no-files-found: error
